name: C/C++ CI

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Setup Conan Client
      uses: conan-io/setup-conan@v1
    - name: Install Dependencies
      run: sudo apt update && sudo apt install xvfb cmake libgtkmm-4.0-dev libwebkitgtk-6.0-dev libgmock-dev
    - name: Build
      run: ./build.sh release
    - name: Run Tests
      run: xvfb-run ./build/build/Release/multiapp_tests
